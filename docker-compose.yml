services:
  backend:
    build:
      context: .
    image: grannycare-backend:latest
    restart: unless-stopped
    environment:
      STATE_FILE: /app/state/runtime_state.json
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - grannycare-state:/app/state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  grannycare-state:
